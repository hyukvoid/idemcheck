<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Sequential retries pass; concurrent duplicates diverge</title>
  <desc id="hero-desc">Two panels compare repeated requests with one Idempotency-Key. Sequential retries return order ID 812 both times. Concurrent duplicates return 812, 810, and 817.</desc>
  <rect width="1200" height="470" fill="#f6f8fa"/>
  <rect x="34" y="34" width="536" height="322" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="630" y="34" width="536" height="322" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text x="66" y="84" fill="#24292f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="0.6">SEQUENTIAL RETRIES</text>
  <rect x="450" y="54" width="82" height="38" rx="19" fill="#dafbe1"/>
  <text x="491" y="80" text-anchor="middle" fill="#1a7f37" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">PASS</text>

  <rect x="66" y="116" width="472" height="72" rx="8" fill="#f6f8fa"/>
  <text x="92" y="161" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21">order_id: 812</text>
  <rect x="66" y="204" width="472" height="72" rx="8" fill="#f6f8fa"/>
  <text x="92" y="249" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21">order_id: 812</text>

  <text x="600" y="207" text-anchor="middle" fill="#57606a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="600">→</text>

  <text x="662" y="84" fill="#24292f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="0.6">CONCURRENT DUPLICATES</text>
  <rect x="1046" y="54" width="82" height="38" rx="19" fill="#ffebe9"/>
  <text x="1087" y="80" text-anchor="middle" fill="#cf222e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">FAIL</text>

  <rect x="662" y="116" width="472" height="54" rx="8" fill="#f6f8fa"/>
  <text x="688" y="151" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">order_id: 812</text>
  <rect x="662" y="180" width="472" height="54" rx="8" fill="#f6f8fa"/>
  <text x="688" y="215" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">order_id: 810</text>
  <rect x="662" y="244" width="472" height="54" rx="8" fill="#f6f8fa"/>
  <text x="688" y="279" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">order_id: 817</text>
  <text x="688" y="328" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">...</text>

  <rect x="34" y="382" width="1132" height="58" rx="8" fill="#24292f"/>
  <text x="66" y="418" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">same Idempotency-Key</text>
  <text x="1134" y="418" text-anchor="end" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">multiple logical results</text>
</svg>