<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Flow diagram: one Idempotency-Key enters BURST, then SETTLE, REPLAY, and VERDICT, which reports PASS, FAIL, or INCONCLUSIVE. Side examples show convergent response bodies for PASS and two different order IDs for FAIL.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>

  <!-- flow column -->
  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="190" y1="56" x2="190" y2="82"/>
    <line x1="190" y1="124" x2="190" y2="150"/>
    <line x1="190" y1="192" x2="190" y2="218"/>
    <line x1="190" y1="260" x2="190" y2="286"/>
    <line x1="190" y1="328" x2="190" y2="362"/>
    <line x1="188" y1="328" x2="74" y2="362"/>
    <line x1="192" y1="328" x2="316" y2="362"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">
    <rect x="95" y="18" width="190" height="36" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="190" y="41" font-weight="600" fill="#1f2328">Same Idempotency-Key</text>

    <rect x="130" y="86" width="120" height="36" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="190" y="109" font-weight="600" fill="#1f2328">BURST</text>

    <rect x="130" y="154" width="120" height="36" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="190" y="177" font-weight="600" fill="#1f2328">SETTLE</text>

    <rect x="130" y="222" width="120" height="36" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="190" y="245" font-weight="600" fill="#1f2328">REPLAY</text>

    <rect x="130" y="290" width="120" height="36" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="190" y="313" font-weight="600" fill="#1f2328">VERDICT</text>

    <rect x="30" y="366" width="80" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="70" y="388" font-weight="700" fill="#1a7f37">PASS</text>

    <rect x="150" y="366" width="80" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="190" y="388" font-weight="700" fill="#cf222e">FAIL</text>

    <rect x="248" y="366" width="145" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="320" y="388" font-weight="700" fill="#9a6700">INCONCLUSIVE</text>
  </g>

  <!-- side examples -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">
    <text x="430" y="72">responses to one idempotency key</text>
  </g>

  <rect x="430" y="86" width="300" height="126" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
    <text x="450" y="114" font-weight="700" fill="#1a7f37">PASS:</text>
    <text x="450" y="142" fill="#1f2328">201 order=123</text>
    <text x="450" y="166" fill="#1f2328">409 processing</text>
    <text x="450" y="190" fill="#1f2328">200 order=123</text>
  </g>

  <rect x="430" y="230" width="300" height="100" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
    <text x="450" y="258" font-weight="700" fill="#cf222e">FAIL:</text>
    <text x="450" y="286" fill="#1f2328">201 order=123</text>
    <text x="450" y="310" fill="#1f2328">201 order=456</text>
  </g>
</svg>
